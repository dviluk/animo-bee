# Camera 1 Profile

camera_name Camera1
camera_id 1
videodevice /dev/video0

# Override target directory to match animo-bee docker mounts
target_dir ../../runtime/camera_1

# Thresholds (adjust as needed for development)
threshold 1500
noise_level 32

# On-screen text
text_left Camera 1
text_right %Y-%m-%d\n%T

# File naming standard
movie_filename %v-%Y%m%d%H%M%S
