# Camera 2 Profile

camera_name Camera2
camera_id 2

# Adjust video device if present (e.g., /dev/video2)
videodevice /dev/video2

# Override target directory to match animo-bee docker mounts
target_dir ../../runtime/camera_2

# Live stream
stream_port 8092
stream_localhost off

# Thresholds
threshold 1500
noise_level 32

# On-screen text
text_left Camera 2
text_right %Y-%m-%d\n%T

# File naming standard
movie_filename %v-%Y%m%d%H%M%S

# Optional: Disable until second camera is connected
# Set movie_output off if no signal
