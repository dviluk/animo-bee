# Shared Native Motion Configuration for animo-bee

# Daemon mode off because we run it directly via scripts
daemon off

# General setup
setup_mode off
log_level 5
log_type all
log_file /var/log/motion/motion.log

# Webcontrol interface
webcontrol_port 8090
webcontrol_localhost off

# Camera properties
width 1280
height 720
framerate 30
netcam_keepalive off

# Default output directory if no camera overrides it
target_dir ../../runtime/

# Video outputs
picture_output off
movie_output on
movie_max_time 60
movie_quality 45
movie_codec mkv

# Include per-camera configurations
camera camera-1.conf
# Include camera-2.conf if present
# camera camera-2.conf