services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start
    environment:
      APP_MODE: production
      HOST: 0.0.0.0
      PORT: ${ANIMO_BEE_APP_PORT:-3001}
      CAMERA_1_DIR: /app/runtime/camera_1
      CAMERA_2_DIR: /app/runtime/camera_2
      PROCESSED_DIR: /app/runtime/processed
      REJECTED_DIR: /app/runtime/rejected
      DB_PATH: /app/runtime/db/${ANIMO_BEE_DB_FILE:-orchestrator.sqlite}
      LOG_DIR: /app/runtime/logs
      OPENCV_ENABLED: ${ANIMO_BEE_OPENCV_ENABLED:-false}
      OPENCV_MODE: ${OPENCV_MODE:-disabled}
      OPENCV_FAIL_OPEN: ${OPENCV_FAIL_OPEN:-true}
      OPENCV_RETAIN_REJECTED_FILES: ${OPENCV_RETAIN_REJECTED_FILES:-true}
      OPENCV_ROI_CONFIG_PATH: ${OPENCV_ROI_CONFIG_PATH:-./config/opencv-roi.example.json}
      OPENCV_MIN_MOTION_DURATION_MS: ${OPENCV_MIN_MOTION_DURATION_MS:-500}
      OPENCV_MAX_BRIGHTNESS_CHANGE: ${OPENCV_MAX_BRIGHTNESS_CHANGE:-0.25}
      OPENCV_MIN_ROI_MOTION_SCORE: ${OPENCV_MIN_ROI_MOTION_SCORE:-0.4}
      OPENCV_WORKER_COMMAND: ${OPENCV_WORKER_COMMAND:-}
      OPENCV_WORKER_ARGS: ${OPENCV_WORKER_ARGS:-[]}
      OPENCV_WORKER_URL: ${OPENCV_WORKER_URL:-}
      OPENCV_TIMEOUT_MS: ${OPENCV_TIMEOUT_MS:-30000}
      UPLOAD_ENABLED: ${UPLOAD_ENABLED:-false}
      UPLOAD_URL: ${UPLOAD_URL:-}
      UPLOAD_HEADERS_JSON: ${UPLOAD_HEADERS_JSON:-{}}
      UPLOAD_MAX_ATTEMPTS: ${UPLOAD_MAX_ATTEMPTS:-3}
      UPLOAD_POLL_INTERVAL_MS: ${UPLOAD_POLL_INTERVAL_MS:-5000}
      UPLOAD_RETRY_DELAY_MS: ${UPLOAD_RETRY_DELAY_MS:-30000}
      UPLOAD_TIMEOUT_MS: ${UPLOAD_TIMEOUT_MS:-60000}
      IRRIGATION_ENABLED: ${IRRIGATION_ENABLED:-false}
      IRRIGATION_TRIGGER_URL: ${IRRIGATION_TRIGGER_URL:-}
      IRRIGATION_HEADERS_JSON: ${IRRIGATION_HEADERS_JSON:-{}}
      IRRIGATION_TIMEOUT_MS: ${IRRIGATION_TIMEOUT_MS:-10000}
    ports:
      - "${ANIMO_BEE_APP_PORT:-3001}:${ANIMO_BEE_APP_PORT:-3001}"
    volumes:
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/data/camera_1:/app/runtime/camera_1
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/data/camera_2:/app/runtime/camera_2
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/data/processed:/app/runtime/processed
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/data/rejected:/app/runtime/rejected
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/db:/app/runtime/db
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/logs:/app/runtime/logs
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:$${PORT:-3001}/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  opencv-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node src/opencv-worker.js
    environment:
      APP_MODE: production
      HOST: 0.0.0.0
      PORT: ${ANIMO_BEE_APP_PORT:-3001}
      CAMERA_1_DIR: /app/runtime/camera_1
      CAMERA_2_DIR: /app/runtime/camera_2
      PROCESSED_DIR: /app/runtime/processed
      REJECTED_DIR: /app/runtime/rejected
      DB_PATH: /app/runtime/db/${ANIMO_BEE_DB_FILE:-orchestrator.sqlite}
      LOG_DIR: /app/runtime/logs
      OPENCV_ENABLED: "true"
      OPENCV_MODE: ${OPENCV_MODE:-shadow}
      OPENCV_FAIL_OPEN: ${OPENCV_FAIL_OPEN:-true}
      OPENCV_RETAIN_REJECTED_FILES: ${OPENCV_RETAIN_REJECTED_FILES:-true}
      OPENCV_ROI_CONFIG_PATH: ${OPENCV_ROI_CONFIG_PATH:-./config/opencv-roi.example.json}
      OPENCV_MIN_MOTION_DURATION_MS: ${OPENCV_MIN_MOTION_DURATION_MS:-500}
      OPENCV_MAX_BRIGHTNESS_CHANGE: ${OPENCV_MAX_BRIGHTNESS_CHANGE:-0.25}
      OPENCV_MIN_ROI_MOTION_SCORE: ${OPENCV_MIN_ROI_MOTION_SCORE:-0.4}
      OPENCV_WORKER_COMMAND: ${OPENCV_WORKER_COMMAND:-}
      OPENCV_WORKER_ARGS: ${OPENCV_WORKER_ARGS:-[]}
      OPENCV_WORKER_URL: ${OPENCV_WORKER_URL:-}
      OPENCV_TIMEOUT_MS: ${OPENCV_TIMEOUT_MS:-30000}
    volumes:
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/data/camera_1:/app/runtime/camera_1
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/data/camera_2:/app/runtime/camera_2
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/data/processed:/app/runtime/processed
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/data/rejected:/app/runtime/rejected
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/db:/app/runtime/db
      - ${ANIMO_BEE_RUNTIME_ROOT:-/mnt/bee-disk/projects/animo-bee}/logs:/app/runtime/logs
    restart: unless-stopped
    init: true
    profiles:
      - opencv
